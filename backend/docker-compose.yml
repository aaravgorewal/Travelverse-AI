version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: travelverse_db
    environment:
      POSTGRES_USER: travelverse
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: travelverse_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: travelverse_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
